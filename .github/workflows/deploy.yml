name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build Astro site
        run: npm run build
        env:
          # Brevo-hosted form endpoint for /desks (Contacts > Forms > share URL).
          # Set it as a repo variable: Settings > Secrets and variables > Actions
          # > Variables > PUBLIC_BREVO_FORM_ACTION. Empty is fine: the page then
          # shows a mailto instead of the field, never a dead form.
          PUBLIC_BREVO_FORM_ACTION: ${{ vars.PUBLIC_BREVO_FORM_ACTION }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
